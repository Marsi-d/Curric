<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Inner border glow -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6" />

  <!-- Curriculum Tree Network -->
  <!-- Connecting lines -->
  <path d="M 256 160 L 256 240" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" opacity="0.8" />
  <path d="M 160 270 L 352 270" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" opacity="0.8" />
  <path d="M 160 270 L 160 340" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" opacity="0.8" />
  <path d="M 256 270 L 256 340" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" opacity="0.8" />
  <path d="M 352 270 L 352 340" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" opacity="0.8" />

  <!-- Root Node (Master Curriculum) -->
  <circle cx="256" cy="140" r="44" fill="url(#nodeGrad)" />
  <!-- Graduation / Book icon inside root node -->
  <path d="M 232 136 L 256 122 L 280 136 L 256 150 Z" fill="#0f172a" />
  <path d="M 238 142 L 238 155 Q 256 165 274 155 L 274 142" fill="none" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
  <path d="M 280 136 L 285 148 L 282 158" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />

  <!-- Child Node 1 (Subject: Blue) -->
  <circle cx="160" cy="356" r="32" fill="#38bdf8" />
  <rect x="146" y="348" width="28" height="16" rx="4" fill="#0f172a" />

  <!-- Child Node 2 (Unit / Milestone: Emerald) -->
  <circle cx="256" cy="356" r="34" fill="url(#accentGrad)" />
  <!-- Checkmark / Star in center -->
  <path d="M 246 356 L 253 363 L 268 348" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Child Node 3 (Rankings / Topics: Violet) -->
  <circle cx="352" cy="356" r="32" fill="#818cf8" />
  <!-- Tier bars -->
  <line x1="342" y1="348" x2="362" y2="348" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
  <line x1="342" y1="356" x2="362" y2="356" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
  <line x1="342" y1="364" x2="356" y2="364" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
</svg>
